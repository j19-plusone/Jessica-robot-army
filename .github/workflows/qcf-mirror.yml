name: Mirror to QCF88888 (manual or main updates)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: qcf-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicitly configured scoped mirror token
        env:
          MIRROR_TOKEN: ${{ secrets.QCF_MIRROR_TOKEN }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::error::QCF_MIRROR_TOKEN missing; mirror not configured."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Push main to organization (no force)
        env:
          MIRROR_TOKEN: ${{ secrets.QCF_MIRROR_TOKEN }}
        run: |
          git remote add qcf "https://x-access-token:${MIRROR_TOKEN}@github.com/QCF88888/Jessica-robot-army.git"
          git push qcf HEAD:refs/heads/main
          git push qcf --tags
          git remote remove qcf
